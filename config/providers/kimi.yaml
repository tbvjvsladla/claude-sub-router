
provider:
  id: kimi
  name: Kimi
  protocol: anthropic

  # Kimi Code subscription endpoint; use a key from the Kimi Code Console,
  # not the separate Moonshot/Kimi Open Platform (the env name is historical).
  # Overseas accounts may use https://api.kimi.ai/coding/ instead.
  base_url: https://api.kimi.com/coding/
  api_key_env: MOONSHOT_API_KEY

models:
  - id: kimi-k3
    upstream_model: k3
    display_name: Kimi K3
    description: Kimi Coding · 1M Context

    context:
      window: 1048576           # 1M (Allegretto/Pro 이상)
      auto_compact_threshold: 800000

    reasoning:
      mode: map
      source:
        effort: output_config.effort
        thinking: thinking
      mapping:
        # Kimi Coding serves thinking-off requests through K2.8 Preview.
        none: { action: disable }
        low: low
        medium: high
        high: high
        xhigh: max
        max: max
      unsupported_level: error
