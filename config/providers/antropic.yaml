provider:
  id: anthropic
  name: Anthropic
  protocol: anthropic
  base_url: https://api.anthropic.com
  auth: claude_native
  api_key_env: ANTHROPIC_API_KEY

models:
  - id: claude-sonnet-5-5
    upstream_model: claude-sonnet-5-5
    display_name: Sonnet 5.5
    description: Claude Code login or Anthropic API key
    default: true
    reasoning:
      mode: map
      source:
        effort: output_config.effort
        thinking: thinking
      mapping:
        # Sonnet 5.5 offers between_tools, but cannot fully disable thinking.
        none: { action: error }
        low: low
        medium: medium
        high: high
        xhigh: xhigh
        max: max
      unsupported_level: error
