provider:
  id: minimax
  name: MiniMax
  protocol: anthropic
  base_url: https://api.minimax.io/anthropic
  api_key_env: MINIMAX_API_KEY

models:
  - id: minimax-m3.1-flash
    upstream_model: MiniMax-M3.1-Flash
    display_name: MiniMax M3.1 Flash
    description: MiniMax API · M3.1 Flash · 1M Context

    context:
      window: 1000000
      auto_compact_threshold: 800000

    reasoning:
      mode: map
      source:
        effort: output_config.effort
        thinking: thinking
      mapping:
        # M3.1 Flash requires thinking; all five positive effort levels are supported.
        none: { action: error }
        low: low
        medium: medium
        high: high
        xhigh: xhigh
        max: max
      unsupported_level: error

  - id: minimax-m3
    upstream_model: MiniMax-M3
    display_name: MiniMax M3
    description: MiniMax API · M3 · 1M Context

    context:
      window: 1000000
      auto_compact_threshold: 800000

    reasoning:
      mode: map
      source:
        effort: output_config.effort
        thinking: thinking
      mapping:
        none: { action: disable }
        # M3 has an on/off toggle, but no configurable effort levels.
        low: &omit_effort { action: omit }
        medium: *omit_effort
        high: *omit_effort
        xhigh: *omit_effort
        max: *omit_effort
      unsupported_level: error
