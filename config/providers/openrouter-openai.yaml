provider:
  id: openrouter-openai
  name: OpenRouter OpenAI
  protocol: anthropic
  base_url: https://openrouter.ai/api
  api_key_env: OPENROUTER_API_KEY
  api_key_header: authorization

models:
  - id: gpt-6.1-sol
    upstream_model: openai/gpt-6.1-sol
    display_name: GPT 6.1 Sol
    description: OpenRouter · OpenAI · 900k Context

    context:
      window: 900000
      auto_compact_threshold: 800000

    reasoning: &openai_reasoning
      mode: map
      source:
        effort: output_config.effort
        thinking: thinking
      mapping:
        low: low
        medium: medium
        high: high
        xhigh: xhigh
        max: max
      unsupported_level: error

  - id: gpt-6-luna
    upstream_model: openai/gpt-6-luna
    display_name: GPT 6 Luna
    description: OpenRouter · OpenAI · 900k Context

    context:
      window: 900000
      auto_compact_threshold: 800000

    reasoning: *openai_reasoning
