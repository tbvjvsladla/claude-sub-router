provider:
  id: deepseek
  name: DeepSeek
  protocol: anthropic
  base_url: https://api.deepseek.com/anthropic
  api_key_env: DEEPSEEK_API_KEY

models:
  - id: deepseek-pro
    upstream_model: deepseek-v4-pro
    display_name: DeepSeek Pro
    description: DeepSeek API · V4 Pro

    context:
      window: 1000000
      auto_compact_threshold: 800000

    reasoning: &deepseek_reasoning
      mode: map
      source:
        effort: output_config.effort
        thinking: thinking
      mapping:
        none: { action: disable }
        low: low
        medium: high
        high: high
        xhigh: high
        max: max
      unsupported_level: error

  - id: deepseek-flash
    # The stable alias is served by DeepSeek-V4.1-Flash-1017.
    upstream_model: deepseek-flash
    display_name: DeepSeek V4.1 Flash 1017
    description: DeepSeek API · V4.1 Flash 1017 · 1M Context

    context:
      window: 1000000
      auto_compact_threshold: 800000

    reasoning: *deepseek_reasoning
