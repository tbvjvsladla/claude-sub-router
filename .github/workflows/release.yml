name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: test "$GITHUB_REF_NAME" = "v$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
      - run: npm ci --include=dev --ignore-scripts
      - run: npm run check && npm test && npm run check:secrets
      - run: npm audit --omit=dev
      - run: npm run package:release
      - run: npm run test:release
      - run: gh release create "$GITHUB_REF_NAME" artifacts/*.tar.gz artifacts/SHA256SUMS --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
